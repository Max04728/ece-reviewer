<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AM Modulation Index — Envelope, Spectrum, Power and Efficiency</title>
<link rel="stylesheet" href="../../../Assets/snippets.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import { widget, fmt, PALETTE } from '../../../Assets/vault.js';

// WHY THIS WIDGET EXISTS
// The exam question is never "what is AM". It is one of:
//   (a) given Ac and Am, find m, then find the total power / sideband power / efficiency;
//   (b) given a measured envelope (Vmax, Vmin), find m = (Vmax - Vmin)/(Vmax + Vmin);
//   (c) recognise overmodulation from an envelope sketch and state the consequence.
// All three live on the same two numbers, so the widget shows the envelope, the line
// spectrum and the power budget together, and enforces the m > 1 regime explicitly —
// including the phase-reversal (envelope fold-through) that an envelope detector cannot
// follow, which is the actual examinable consequence of overmodulation.
//
// Load resistance is normalised to R = 1 ohm, so Pc = Ac^2/2 and the power ratios that
// matter in the exam are exact and independent of R.

const panels = (ctx, plot, { top, bottom, yMin, yMax }) => {
  const px0 = plot.pad, px1 = plot.w - plot.pad;
  return {
    px0, px1, top, bottom, yMin, yMax,
    X: (x, xMin, xMax) => px0 + ((x - xMin) / (xMax - xMin)) * (px1 - px0),
    Y: (y) => bottom - ((y - yMin) / (yMax - yMin)) * (bottom - top),
    line(x1, y1, x2, y2, color, width = 1.5, dash = null) {
      ctx.save(); ctx.setLineDash(dash || []); ctx.strokeStyle = color;
      ctx.lineWidth = width; ctx.beginPath();
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
    },
    text(s, x, y, color = PALETTE.text, align = 'left', font = '11px ui-monospace, monospace') {
      ctx.save(); ctx.fillStyle = color; ctx.textAlign = align; ctx.font = font;
      ctx.fillText(s, x, y); ctx.restore();
    },
  };
};

widget({
  title: 'AM Modulation Index — Waveform, Envelope, Spectrum and Power',
  description:
    'Ac and Am set m = Am/Ac, and m alone sets the power budget: P = Pc(1 + m^2/2). Watch the envelope, the two sidebands and the efficiency move together, and see exactly what breaks when m passes 1.',
  height: 580,
  controls: [
    { id: 'Ac', label: 'carrier amplitude Ac', min: 0.5, max: 5, step: 0.1, value: 2, unit: 'V' },
    { id: 'Am', label: 'modulating amplitude Am', min: 0, max: 8, step: 0.05, value: 1, unit: 'V' },
    { id: 'fm', label: 'modulating frequency fm', min: 0.5, max: 5, step: 0.1, value: 1, unit: 'kHz' },
    { id: 'fc', label: 'carrier frequency fc', min: 10, max: 40, step: 0.5, value: 20, unit: 'kHz' },
  ],
  compute: (v) => {
    const m = v.Am / v.Ac;
    const Pc = (v.Ac * v.Ac) / 2;                 // R = 1 ohm
    const Psb = (m * m / 4) * v.Ac * v.Ac;        // both sidebands, R = 1 ohm
    const Ptotal = (v.Ac * v.Ac / 2) * (1 + m * m / 2);
    const eff = m * m / (2 + m * m);              // Psb / Ptotal
    const Vmax = v.Ac * (1 + m), Vmin = v.Ac * (1 - m);
    const mFromEnv = (Vmax + Vmin) !== 0 ? (Vmax - Vmin) / (Vmax + Vmin) : 0;
    const mPeak = Math.max(m, 1e-9);
    const T = 1 / v.fc;
    return {
      m, Pc, Psb, Ptotal, eff, Vmax, Vmin, mFromEnv, T, fc: v.fc, fm: v.fm,
      bw: 2 * v.fm,
      regime: m < 0.999 ? 'under-modulation (m < 1)' : (Math.abs(m - 1) < 0.01 ? '100 % modulation (m = 1)' : 'OVERMODULATION (m > 1)'),
      over: m > 1.0001,
      // overmodulation: carrier phase inverts whenever the envelope goes negative
      zeroCross: v.Am > v.Ac ? [Math.PI / 2 + Math.asin(v.Ac / v.Am), 3 * Math.PI / 2 - Math.asin(v.Ac / v.Am)] : null,
      fUS: 1 / (v.fc + v.fm), fLS: 1 / (v.fc - v.fm),
    };
  },
  draw: (ctx, v, o, plot) => {
    plot.clear();
    const A0 = o.over ? o.Vmax : o.Vmax * 1.08;
    const padTime = A0 * 0.22;
    // time axis: 3 periods of the envelope (the slowest component)
    const Tm = 1 / v.fm;
    const tMax = 3 * Tm;
    const xMin = 0, xMax = tMax;

    // ---------------------------------------------------------------- time --
    const T = panels(ctx, plot, { top: 30, bottom: 250, yMin: -(A0 + padTime), yMax: A0 + padTime });
    T.line(T.px0, 0, T.px1, 0, PALETTE.axis, 1);
    // fc gridlines (every carrier cycle) are too dense; show only the envelope period
    for (let k = 0; k <= 3; k++) {
      const px = T.X(k * Tm, xMin, xMax);
      T.line(px, T.top, px, T.bottom, PALETTE.grid, 1, [3, 4]);
    }
    // envelope
    const env = (t) => v.Ac + v.Am * Math.cos(2 * Math.PI * v.fm * t);
    const wf = (t) => env(t) * Math.cos(2 * Math.PI * v.fc * t);
    ctx.save();
    ctx.beginPath();
    for (let i = 0; i <= 1600; i++) {
      const t = xMin + (xMax - xMin) * i / 1600;
      const px = T.X(t, xMin, xMax), py = T.Y(env(t));
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.strokeStyle = PALETTE.accent3; ctx.lineWidth = 2; ctx.setLineDash([6, 4]); ctx.stroke();
    ctx.beginPath();
    for (let i = 0; i <= 1600; i++) {
      const t = xMin + (xMax - xMin) * i / 1600;
      const px = T.X(t, xMin, xMax), py = T.Y(-env(t));
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();
    // the three components that add to make the AM wave (thin, so the sum is readable)
    const drawFn = (f, color) => {
      ctx.save(); ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
      for (let i = 0; i <= 1600; i++) {
        const t = xMin + (xMax - xMin) * i / 1600;
        const px = T.X(t, xMin, xMax), py = T.Y(f(t));
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.stroke(); ctx.restore();
    };
    drawFn((t) => v.Ac * Math.cos(2 * Math.PI * v.fc * t), 'rgba(137,180,250,0.55)');
    drawFn((t) => (v.Am / 2) * Math.cos(2 * Math.PI * (v.fc - v.fm) * t), 'rgba(203,166,247,0.55)');
    drawFn((t) => (v.Am / 2) * Math.cos(2 * Math.PI * (v.fc + v.fm) * t), 'rgba(166,227,161,0.55)');
    // the AM waveform on top
    ctx.save(); ctx.beginPath(); ctx.strokeStyle = PALETTE.accent; ctx.lineWidth = 1.8;
    for (let i = 0; i <= 2400; i++) {
      const t = xMin + (xMax - xMin) * i / 2400;
      const px = T.X(t, xMin, xMax), py = T.Y(wf(t));
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke(); ctx.restore();

    // labels for Vmax / Vmin at the first envelope peak and trough
    T.line(T.px0, T.Y(o.Vmax), T.px1, T.Y(o.Vmax), 'rgba(166,227,161,0.30)', 1, [2, 4]);
    if (o.Vmin >= 0) T.line(T.px0, T.Y(o.Vmin), T.px1, T.Y(o.Vmin), 'rgba(166,227,161,0.30)', 1, [2, 4]);
    else T.line(T.px0, T.Y(0), T.px1, T.Y(0), PALETTE.warn, 1.5, [5, 5]);
    const pxPeak = T.X(0, xMin, xMax);
    T.line(pxPeak, T.Y(v.Ac), pxPeak, T.Y(o.Vmax), PALETTE.accent3, 2.5);
    T.text('Vmax = Ac(1+m) = ' + fmt(o.Vmax, 4), pxPeak + 5, T.Y(o.Vmax) + 4, PALETTE.accent3);
    T.line(pxPeak, T.Y(v.Ac), pxPeak, T.Y(Math.min(o.Vmin, 0)), PALETTE.accent2, 2.5);
    T.text('Vmin = Ac(1−m) = ' + fmt(o.Vmin, 4) + (o.Vmin < 0 ? '  (negative → phase reversal)' : ''),
      pxPeak + 5, Math.max(T.Y(Math.min(o.Vmin, 0)) + 14, T.top + 40), PALETTE.accent2);

    // overmodulation shading where the envelope is negative
    if (o.over) {
      ctx.save(); ctx.fillStyle = 'rgba(243,139,168,0.13)';
      for (let k = 0; k < 3; k++) {
        const a = o.zeroCross[0] + k * 2 * Math.PI, b = o.zeroCross[1] + k * 2 * Math.PI;
        const ta = a / (2 * Math.PI * v.fm), tb = b / (2 * Math.PI * v.fm);
        if (tb > xMax) break;
        ctx.fillRect(T.X(ta, xMin, xMax), T.top, T.X(tb, xMin, xMax) - T.X(ta, xMin, xMax), T.bottom - T.top);
      }
      ctx.restore();
      T.text('shaded: envelope < 0 — a diode envelope detector follows |envelope| and the recovered tone is 180° out of phase here (distortion)',
        T.px0, T.top + 12, PALETTE.accent2, 'left', '11px ui-monospace, monospace');
    }
    T.text('AM waveform  s(t) = [Ac + Am·cos(2π fm t)]·cos(2π fc t)   —   fc = ' + fmt(v.fc, 4) + ' kHz, fm = ' + fmt(v.fm, 4) + ' kHz',
      T.px0, T.top - 10, PALETTE.dim);
    T.text('time (ms) →', T.px1, T.bottom + 14, PALETTE.dim, 'right');

    // ------------------------------------------------------------ spectrum --
    const S = panels(ctx, plot, { top: 300, bottom: 442, yMin: 0, yMax: v.Ac * 1.25 });
    const fMin = v.fc - 3 * v.fm, fMax = v.fc + 3 * v.fm;
    const px = (f) => S.X(f, fMin, fMax);
    S.line(S.px0, S.Y(0), S.px1, S.Y(0), PALETTE.axis, 1.5);
    const stem = (f, amp, color, name) => {
      const X = px(f);
      S.line(X, S.Y(0), X, S.Y(amp), color, 2.5);
      ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X, S.Y(amp), 4, 0, 6.2832); ctx.fill(); ctx.restore();
      S.text(name, X, S.Y(amp) - 8, color, 'center');
      S.text(fmt(amp, 4) + ' V', X, S.Y(amp) - 21, PALETTE.dim, 'center', '10px ui-monospace, monospace');
      S.text(fmt(f, 4) + ' kHz', X, S.Y(0) + 14, PALETTE.dim, 'center', '10px ui-monospace, monospace');
    };
    stem(v.fc, v.Ac, PALETTE.accent, 'carrier');
    stem(v.fc - v.fm, v.Am / 2, PALETTE.accent5, 'LSB');
    stem(v.fc + v.fm, v.Am / 2, PALETTE.accent3, 'USB');
    // bandwidth bracket
    const yb = S.Y(v.Ac * 1.15);
    S.line(px(v.fc - v.fm), yb, px(v.fc + v.fm), yb, PALETTE.warn, 1.5);
    S.line(px(v.fc - v.fm), yb - 4, px(v.fc - v.fm), yb + 4, PALETTE.warn, 1.5);
    S.line(px(v.fc + v.fm), yb - 4, px(v.fc + v.fm), yb + 4, PALETTE.warn, 1.5);
    S.text('BW = 2fm = ' + fmt(o.bw, 4) + ' kHz', (px(v.fc - v.fm) + px(v.fc + v.fm)) / 2, yb - 7, PALETTE.warn, 'center');
    S.text('line spectrum: one carrier and exactly two sidebands, spaced fm either side, each Am/2 tall',
      S.px0, S.top - 10, PALETTE.dim);

    // -------------------------------------------------------- power budget --
    const P = panels(ctx, plot, { top: 500, bottom: 546, yMin: 0, yMax: o.Ptotal * 1.02 });
    const barW = 92, gap = 150;
    const bars = [
      { x: P.px0 + 20, h: o.Pc, label: 'Pc', sub: fmt(o.Pc, 4) + ' W', color: PALETTE.accent },
      { x: P.px0 + 20 + gap, h: o.Psb / 2, label: 'LSB', sub: fmt(o.Psb / 2, 5) + ' W', color: PALETTE.accent5 },
      { x: P.px0 + 20 + 2 * gap, h: o.Psb / 2, label: 'USB', sub: fmt(o.Psb / 2, 5) + ' W', color: PALETTE.accent3 },
      { x: P.px0 + 20 + 3 * gap, h: o.Ptotal, label: 'P total', sub: fmt(o.Ptotal, 4) + ' W', color: PALETTE.warn },
    ];
    P.line(P.px0, P.bottom, P.px1, P.bottom, PALETTE.axis, 1.5);
    for (const b of bars) {
      const h = Math.max(0.8, (b.h / (o.Ptotal * 1.02)) * (P.bottom - P.top));
      ctx.save(); ctx.fillStyle = b.color; ctx.globalAlpha = 0.85;
      ctx.fillRect(b.x, P.bottom - h, barW, h); ctx.restore();
      ctx.save(); ctx.strokeStyle = b.color; ctx.lineWidth = 1;
      ctx.strokeRect(b.x, P.bottom - h, barW, h); ctx.restore();
      P.text(b.label, b.x + barW / 2, P.bottom + 13, b.color, 'center');
      P.text(b.sub, b.x + barW / 2, P.bottom - h - 5, PALETTE.dim, 'center', '10px ui-monospace, monospace');
    }
    P.text('power budget (R = 1 Ω): carrier carries the majority of the power; the sidebands carry the information',
      P.px0, P.top - 6, PALETTE.dim);

    // ------------------------------------------------------- substituted eq --
    const F = document.getElementById('am-formula');
    if (F) {
      F.innerHTML =
        '<div><strong>m = Am / Ac</strong> = ' + fmt(v.Am, 4) + ' / ' + fmt(v.Ac, 4) + ' = <strong>' + fmt(o.m, 5) + '</strong>'
        + ' &nbsp;|&nbsp; check from the sketch: (Vmax − Vmin)/(Vmax + Vmin) = (' + fmt(o.Vmax, 4) + ' − ' + fmt(o.Vmin, 4)
        + ')/(' + fmt(o.Vmax, 4) + ' + ' + fmt(o.Vmin, 4) + ') = ' + fmt(o.mFromEnv, 5)
        + ' &nbsp;→ <strong>' + o.regime + '</strong></div>'
        + '<div><strong>P = Pc(1 + m²/2)</strong> = ' + fmt(o.Pc, 4) + ' × (1 + ' + fmt(o.m * o.m / 2, 5) + ') = <strong>'
        + fmt(o.Ptotal, 5) + ' W</strong> &nbsp;(Pc = Ac²/2R = ' + fmt(v.Ac, 4) + '²/2 = ' + fmt(o.Pc, 5) + ' W at R = 1 Ω)</div>'
        + '<div><strong>P<sub>USB</sub> = P<sub>LSB</sub> = m²Pc/4</strong> = ' + fmt(o.m * o.m * o.Pc / 4, 5)
        + ' W each, so <strong>P<sub>SB</sub> = m²Pc/2 = ' + fmt(o.Psb, 5) + ' W</strong></div>'
        + '<div><strong>η = P<sub>SB</sub>/P<sub>total</sub> = m²/(2 + m²)</strong> = ' + fmt(o.m * o.m, 5) + '/(' + fmt(2 + o.m * o.m, 5)
        + ') = <strong>' + fmt(o.eff * 100, 4) + ' %</strong> &nbsp;— the ceiling is 33.3 % at m = 1, reached only in the limit of m → ∞</div>'
        + '<div><strong>BW = 2fm</strong> = 2 × ' + fmt(v.fm, 4) + ' kHz = <strong>' + fmt(o.bw, 5) + ' kHz</strong>'
        + ' &nbsp;|&nbsp; upper sideband at fc + fm = ' + fmt(v.fc + v.fm, 5) + ' kHz, lower at fc − fm = ' + fmt(v.fc - v.fm, 5) + ' kHz</div>';
    }
  },
  readout: (out, state) => ({
    'modulation index m': fmt(out.m, 5),
    'regime': out.regime,
    'Vmax / Vmin': fmt(out.Vmax, 4) + ' / ' + fmt(out.Vmin, 4) + ' V',
    'carrier power Pc': fmt(out.Pc, 5) + ' W',
    'sideband power PSB': fmt(out.Psb, 5) + ' W',
    'total power P': fmt(out.Ptotal, 5) + ' W',
    'efficiency η': fmt(out.eff * 100, 4) + ' %',
    'bandwidth 2fm': fmt(out.bw, 4) + ' kHz',
    'overmodulated?': out.over ? 'YES — envelope distortion' : 'no',
  }),
});

const host = document.getElementById('app');
const formula = document.createElement('div');
formula.className = 'vault-widget-note';
formula.id = 'am-formula';
formula.style.borderLeftColor = 'var(--vw-accent)';
host.appendChild(formula);

const note = document.createElement('div');
note.className = 'vault-widget-note';
note.innerHTML =
  '<strong>Key insight: m is a ratio of two amplitudes, and it fixes the entire power budget by itself.</strong> '
  + 'm = Am/Ac; P = Pc(1 + m²/2); each sideband is m²Pc/4; η = m²/(2 + m²). Because η is monotone in m and caps at '
  + '1/3 as m grows, the best a full-carrier AM transmitter can ever do is 33.3 % efficiency at m = 1 — the other '
  + '66.7 % is spent on a carrier that carries no information at all. That single fact is why DSB/SSB suppressed-carrier '
  + 'systems exist.'
  + '<br><strong>Three mistakes this widget prevents.</strong> '
  + '(1) <em>Using the envelope formula with the wrong pair.</em> m = (Vmax − Vmin)/(Vmax + Vmin) works on the '
  + 'envelope, and for a single tone it is identical to Am/Ac. Students who remember only Am/Ac freeze when the '
  + 'problem gives Vmax and Vmin, and students who remember only the envelope formula compute with peak and RMS '
  + 'mixed. Both are shown live and must agree. '
  + '(2) <em>Believing m &gt; 1 only "looks bad".</em> It is a concrete failure: the envelope goes negative, the actual '
  + 'AM wave is [Ac + Am cos]·cos, and a diode envelope detector sees |envelope| — so for the shaded part of each '
  + 'envelope cycle the recovered audio is inverted 180°. The output is not merely clipped, it is distorted and the '
  + 'sideband spacing doubles (splatter). This is the exact wording of the board question and the reason '
  + 'broadcasters keep m ≤ 1 (typically 0.85–0.95 for headroom). '
  + '(3) <em>Forgetting that Pc is set by the carrier alone.</em> Turning up Am raises total power and efficiency but '
  + 'never changes Pc, so the spectrum analyser reading at fc is a direct measurement of Ac²/2R — that is how m is '
  + 'measured on a real transmitter, from the sideband-to-carrier amplitude ratio.'
  + '<br><strong>Exam reflex:</strong> a carrier of 10 V and m = 0.6 gives Pc = 50 W, P = 59 W, PSB = 9 W, η = 15.25 %. '
  + 'If a question says "total power is 1.5 times the carrier power", then 1 + m²/2 = 1.5, so m = 1 (100 % modulation) — '
  + 'the arithmetic is always run backwards from these same three equations.';
host.appendChild(note);
</script>
</body>
</html>
