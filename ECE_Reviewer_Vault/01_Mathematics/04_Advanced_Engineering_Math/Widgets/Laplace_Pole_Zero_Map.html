<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laplace Pole-Zero Map — ROC, Stability and the Inverse Transform</title>
<link rel="stylesheet" href="../../../Assets/snippets.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import { widget, fmt, PALETTE } from '../../../Assets/vault.js';

// A pole-zero map answers three board questions at once: WHERE are the poles (regions of
// convergence), are they all in the left half-plane (stability), and what does the inverse
// transform look like (exponential / damped sinusoid / constant). The widget therefore
// always prints the substituted characteristic polynomial next to the picture, so the
// plotted crosses can be checked by hand against the quadratic formula.

// ---------------------------------------------------------------------------
// complex arithmetic + a real-polynomial root finder
// ---------------------------------------------------------------------------
function cAdd(a, b) { return { re: a.re + b.re, im: a.im + b.im }; }
function cSub(a, b) { return { re: a.re - b.re, im: a.im - b.im }; }
function cMul(a, b) { return { re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }; }
function cDiv(a, b) {
  const d = b.re * b.re + b.im * b.im;
  if (d < 1e-300) return { re: NaN, im: NaN };
  return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d };
}
function cAbs(a) { return Math.hypot(a.re, a.im); }

/** Roots of a real polynomial, coefficients highest-degree first. Returns [{re,im}]. */
function polyRoots(coefIn) {
  const c = coefIn.slice();
  while (c.length > 1 && Math.abs(c[0]) < 1e-12) c.shift();
  const n = c.length - 1;
  if (n < 1) return [];
  if (n === 1) return [{ re: -c[1] / c[0], im: 0 }];
  if (n === 2) {
    const a = c[0], b = c[1], e = c[2];
    const disc = b * b - 4 * a * e;
    if (disc >= 0) {
      const s = Math.sqrt(Math.abs(disc));
      const r1 = (-b + s) / (2 * a), r2 = (-b - s) / (2 * a);
      return [{ re: Math.max(r1, r2), im: 0 }, { re: Math.min(r1, r2), im: 0 }];
    }
    const s = Math.sqrt(-disc);
    return [{ re: -b / (2 * a), im: s / (2 * a) }, { re: -b / (2 * a), im: -s / (2 * a) }];
  }
  // Durand-Kerner for degree >= 3 (used by 1/(s(s+1)(s+2)) and any custom cubic seed).
  const lead = c[0];
  const a = c.map((x) => x / lead);
  let z = [];
  let cur = { re: 1, im: 0 };
  const seed = { re: 0.4, im: 0.9 };
  for (let k = 0; k < n; k++) { cur = cMul(cur, seed); z.push({ re: cur.re, im: cur.im }); }
  for (let iter = 0; iter < 400; iter++) {
    let worst = 0;
    const next = [];
    for (let i = 0; i < n; i++) {
      let num = { re: a[0], im: 0 };
      for (let k = 1; k <= n; k++) num = cAdd(cMul(num, z[i]), { re: a[k], im: 0 });
      let den = { re: 1, im: 0 };
      for (let j = 0; j < n; j++) if (j !== i) den = cMul(den, cSub(z[i], z[j]));
      const q = cDiv(num, den);
      next.push(cSub(z[i], q));
      worst = Math.max(worst, cAbs(q));
    }
    z = next;
    if (!Number.isFinite(worst) || worst < 1e-14) break;
  }
  return z.map((r) => {
    const mag = Math.max(1, cAbs(r));
    // Snap a numerically-complex-but-really-real root back onto the real axis.
    return { re: r.re, im: Math.abs(r.im) < mag * 1e-6 ? 0 : r.im };
  });
}

function locStr(list, tag) {
  if (!list || !list.length) return 'none';
  const parts = [];
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const re = fmt(p.re, 5);
    const im = Math.abs(p.im);
    if (im < 1e-7) parts.push(tag + (i + 1) + ' = ' + re);
    else parts.push(tag + (i + 1) + ' = ' + re + (p.im > 0 ? ' + j' : ' - j') + fmt(im, 5));
  }
  return parts.join('   ,   ');
}

widget({
  title: 'Laplace Pole-Zero Map — ROC, Stability, Inverse Transform',
  description:
    'Pick a transfer function form and slide its parameters. The crosses are the poles and the circles the zeros of H(s) in the s-plane. For a causal signal the region of convergence is the half-plane to the right of the right-most pole; the system is stable only when the jw axis lies inside that region, i.e. every pole is strictly in the left half-plane.',
  height: 500,
  range: { xMin: -6, xMax: 2, yMin: -4, yMax: 4 },
  controls: [
    { id: 'preset', label: 'transfer function form', type: 'select', options: [
      { value: 'first', label: '1/(s + a)  — one real pole' },
      { value: 'second', label: 'wn^2/(s^2 + 2*zeta*wn*s + wn^2)  — second order' },
      { value: 'lead', label: '(s + z)/((s + p1)(s + p2))  — zero + two real poles' },
      { value: 'triple', label: '1/(s(s + 1)(s + 2))  — integrator + two poles' },
      { value: 'custom', label: 'custom coefficients (bottom sliders)' },
    ], value: 'second' },
    { id: 'a', label: 'a  — first-order pole location', min: 0.2, max: 6, step: 0.1, value: 2 },
    { id: 'zeta', label: 'zeta  — damping ratio', min: 0, max: 2, step: 0.02, value: 0.3 },
    { id: 'wn', label: 'wn  — natural frequency (rad/s)', min: 0.3, max: 8, step: 0.1, value: 2 },
    { id: 'z', label: 'z  — zero location', min: 0, max: 6, step: 0.1, value: 3 },
    { id: 'p1', label: 'p1  — first pole', min: 0.2, max: 6, step: 0.1, value: 1 },
    { id: 'p2', label: 'p2  — second pole', min: 0.2, max: 6, step: 0.1, value: 4 },
    { id: 'b2', label: 'custom numerator  b2 (s^2 term)', min: -4, max: 4, step: 0.25, value: 0 },
    { id: 'b1', label: 'custom numerator  b1 (s term)', min: -4, max: 4, step: 0.25, value: 1 },
    { id: 'b0', label: 'custom numerator  b0 (constant)', min: -4, max: 4, step: 0.25, value: 2 },
    { id: 'a2', label: 'custom denominator  a2 (s^2 term)', min: -4, max: 4, step: 0.25, value: 1 },
    { id: 'a1', label: 'custom denominator  a1 (s term)', min: -4, max: 4, step: 0.25, value: 3 },
    { id: 'a0', label: 'custom denominator  a0 (constant)', min: -4, max: 4, step: 0.25, value: 2 },
  ],

  compute: (v) => {
    let num, den, hLabel, subLine;
    if (v.preset === 'first') {
      num = [1];
      den = [1, v.a];
      hLabel = 'H(s) = 1/(s + a)';
      subLine = 'H(s) = 1/(s + ' + fmt(v.a, 4) + ')';
    } else if (v.preset === 'second') {
      num = [v.wn * v.wn];
      den = [1, 2 * v.zeta * v.wn, v.wn * v.wn];
      hLabel = 'H(s) = wn^2/(s^2 + 2*zeta*wn*s + wn^2)';
      subLine = 'H(s) = ' + fmt(v.wn * v.wn, 5) + '/(s^2 + ' + fmt(2 * v.zeta * v.wn, 5) +
                ' s + ' + fmt(v.wn * v.wn, 5) + ')';
    } else if (v.preset === 'lead') {
      num = [1, v.z];
      den = [1, v.p1 + v.p2, v.p1 * v.p2];
      hLabel = 'H(s) = (s + z)/((s + p1)(s + p2))';
      subLine = 'H(s) = (s + ' + fmt(v.z, 4) + ')/((s + ' + fmt(v.p1, 4) + ')(s + ' + fmt(v.p2, 4) + '))';
    } else if (v.preset === 'triple') {
      num = [1];
      den = [1, 3, 2, 0];
      hLabel = 'H(s) = 1/(s(s + 1)(s + 2))';
      subLine = 'H(s) = 1/(s^3 + 3 s^2 + 2 s)';
    } else {
      num = [v.b2, v.b1, v.b0];
      den = [v.a2, v.a1, v.a0];
      hLabel = 'H(s) = (b2 s^2 + b1 s + b0)/(a2 s^2 + a1 s + a0)';
      subLine = 'H(s) = (' + fmt(v.b2, 4) + ' s^2 + ' + fmt(v.b1, 4) + ' s + ' + fmt(v.b0, 4) +
                ')/( ' + fmt(v.a2, 4) + ' s^2 + ' + fmt(v.a1, 4) + ' s + ' + fmt(v.a0, 4) + ' )';
    }

    const numZero = num.every((x) => Math.abs(x) < 1e-12);
    const denZero = den.every((x) => Math.abs(x) < 1e-12);

    const poles = denZero ? [] : polyRoots(den);
    const zeros = (numZero || denZero) ? [] : polyRoots(num);

    // -------------------------------------------------------------- stability
    const reals = poles.map((p) => p.re);
    const maxRe = reals.length ? Math.max.apply(null, reals) : -Infinity;
    const TOL = 1e-9;
    let verdict, stable;
    if (!poles.length) {
      verdict = 'NO POLES — H(s) is a polynomial, so there is no stability constraint from poles.';
      stable = 'no poles';
    } else if (maxRe > TOL) {
      verdict = 'UNSTABLE — at least one pole has a positive real part (right half-plane).';
      stable = 'NO — pole in the right half-plane';
    } else if (maxRe > -TOL) {
      verdict = 'MARGINALLY STABLE — a pole sits exactly on the jw axis (sustained oscillation or a constant).';
      stable = 'NO (marginally) — pole on the jw axis';
    } else {
      verdict = 'STABLE — every pole is strictly inside the left half-plane, so the jw axis is inside the ROC.';
      stable = 'YES — all poles in the left half-plane';
    }

    // ------------------------------------------------- damping ratio and wn
    let dampStr = 'no complex pair (all poles real)';
    let zetaOut = NaN, wnOut = NaN;
    const cx = poles.filter((p) => Math.abs(p.im) > 1e-7);
    if (cx.length >= 2) {
      const p = cx.find((q) => q.im > 0) || cx[0];
      wnOut = cAbs(p);
      zetaOut = wnOut > 0 ? -p.re / wnOut : 0;
      dampStr = 'complex pair ' + fmt(p.re, 5) + ' +/- j' + fmt(Math.abs(p.im), 5) +
                '  ->  wn = ' + fmt(wnOut, 5) + ' rad/s, zeta = ' + fmt(zetaOut, 5) +
                ', wd = wn*sqrt(1 - zeta^2) = ' + fmt(wnOut * Math.sqrt(Math.abs(1 - zetaOut * zetaOut)), 5) + ' rad/s';
    } else if (poles.length) {
      const p = poles[0];
      wnOut = Math.abs(p.re);
      zetaOut = p.re < 0 ? 1 : (p.re > 0 ? -1 : 0);
      dampStr = 'real pole ' + fmt(p.re, 5) + '  ->  wn = |p| = ' + fmt(wnOut, 5) +
                ' rad/s, zeta = ' + fmt(zetaOut, 3) + ' (first-order equivalent)';
    } else {
      dampStr = 'undefined — no poles';
    }

    // ------------------------------------------------ inverse Laplace form
    const hasOrigin = poles.some((p) => cAbs(p) < 1e-9);
    const hasPos = poles.some((p) => p.re > TOL);
    const hasCx = cx.length > 0;
    const allImag = poles.length > 0 && poles.every((p) => Math.abs(p.re) < 1e-9);
    let form;
    if (denZero) form = 'undefined — the denominator is identically zero';
    else if (hasPos) form = 'growing exponentials e^(+sigma t): unstable, no steady state';
    else if (allImag && hasCx) form = 'undamped sinusoid A cos(w0 t) + B sin(w0 t) (poles on the jw axis)';
    else if (hasOrigin && hasCx) form = 'constant (step) term + damped sinusoid e^(-sigma t)(A cos wd t + B sin wd t)';
    else if (hasOrigin) form = 'constant (step) term + sum of decaying exponentials';
    else if (hasCx) form = 'damped sinusoid e^(-sigma t)(A cos wd t + B sin wd t)';
    else if (poles.length) form = 'sum of decaying exponentials  sum A_k e^(p_k t)';
    else form = 'impulses and derivatives only (no poles)';

    const rocStart = poles.length ? maxRe : -Infinity;

    // settling-time style number for the dominant pole (useful sanity check)
    const tau = poles.length && maxRe < 0 ? -1 / maxRe : Infinity;

    return { poles, zeros, num, den, hLabel, subLine, numZero, denZero, verdict, stable,
             dampStr, zetaOut, wnOut, form, rocStart, maxRe, tau, stable_ok: (maxRe < -TOL), count: poles.length };
  },

  draw: (ctx, v, out, plot) => {
    const poles = out.poles || [];
    const zeros = out.zeros || [];
    plot.clear();

    // ------------------------------------------------------- data-space window
    let R = 1;
    for (const p of poles) R = Math.max(R, Math.abs(p.re), Math.abs(p.im));
    for (const z of zeros) R = Math.max(R, Math.abs(z.re), Math.abs(z.im));
    R = R * 1.15;
    const reMin = -1.45 * R, reMax = 0.55 * R, imMax = 1.2 * R;

    const pad = plot.pad;
    const L = pad + 54, Rp = plot.w - pad - 16;
    const T = pad + 78, B = plot.h - pad - 34;
    const X = (re) => L + ((re - reMin) / (reMax - reMin)) * (Rp - L);
    const Y = (im) => (T + B) / 2 - (im / imMax) * ((B - T) / 2);
    // Local segment helper: the Plot helpers map with the Plot's OWN range, which is
    // wrong inside a custom-mapped panel, so every line here goes through X()/Y().
    const seg = (x1, y1, x2, y2, opts) => {
      const o = opts || {};
      ctx.save();
      ctx.strokeStyle = o.color || PALETTE.accent2;
      ctx.lineWidth = o.width || 2;
      if (o.dash) ctx.setLineDash(o.dash);
      ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
      ctx.restore();
    };

    // ------------------------------------------------------------ ROC shading
    const rocStart = Number.isFinite(out.rocStart) ? out.rocStart : reMin;
    const xr = Math.max(L, Math.min(Rp, X(rocStart)));
    ctx.save();
    ctx.fillStyle = 'rgba(137,180,250,0.15)';
    ctx.fillRect(xr, T, Rp - xr, B - T);
    ctx.fillStyle = 'rgba(243,139,168,0.13)';
    ctx.fillRect(L, T, xr - L, B - T);
    ctx.restore();

    // ------------------------------------------------------------ grid + frame
    ctx.save();
    ctx.strokeStyle = PALETTE.grid;
    ctx.lineWidth = 1;
    for (let re = Math.ceil(reMin); re <= reMax; re++) {
      ctx.beginPath(); ctx.moveTo(X(re), T); ctx.lineTo(X(re), B); ctx.stroke();
    }
    for (let im = Math.ceil(-imMax); im <= imMax; im++) {
      ctx.beginPath(); ctx.moveTo(L, Y(im)); ctx.lineTo(Rp, Y(im)); ctx.stroke();
    }
    ctx.strokeStyle = PALETTE.axis;
    ctx.lineWidth = 1.4;
    ctx.strokeRect(L, T, Rp - L, B - T);
    ctx.restore();

    // sigma and jw axes
    seg(reMin, 0, reMax, 0, { color: PALETTE.axis, width: 1.6 });
    seg(0, -imMax, 0, imMax, { color: PALETTE.warn, width: 2.2, dash: [6, 4] });
    plot.text('jw axis (stability boundary)', X(0) + 6, T + 14, { color: PALETTE.warn, font: '10px ui-monospace, monospace' });
    plot.text('sigma', Rp - 4, Y(0) + 15, { color: PALETTE.dim, font: '10px ui-monospace, monospace', align: 'right' });
    plot.text('jw', X(0) + 5, T + 30, { color: PALETTE.dim, font: '10px ui-monospace, monospace' });

    // ROC edge marker
    if (Number.isFinite(out.rocStart) && out.rocStart > reMin && out.rocStart < reMax) {
      seg(out.rocStart, -imMax, out.rocStart, imMax, { color: PALETTE.accent, width: 2, dash: [4, 3] });
      plot.text('ROC edge: Re(s) = ' + fmt(out.rocStart, 4), X(out.rocStart) + 5, B - 8,
        { color: PALETTE.accent, font: '11px ui-monospace, monospace' });
    }
    plot.text('ROC: Re(s) > ' + (Number.isFinite(out.rocStart) ? fmt(out.rocStart, 4) : '-inf') + '  (causal)',
      L + 6, T + 14, { color: PALETTE.accent, font: '11px ui-monospace, monospace' });

    // ------------------------------------------------------------ poles: x marks
    const drawX = (re, im, color, tag) => {
      const px = X(re), py = Y(im), s = 6;
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(px - s, py - s); ctx.lineTo(px + s, py + s);
      ctx.moveTo(px + s, py - s); ctx.lineTo(px - s, py + s);
      ctx.stroke();
      ctx.restore();
      if (tag) plot.text(tag, px + 8, py - 8, { color: color, font: '11px ui-monospace, monospace' });
    };
    const drawO = (re, im, color, tag) => {
      const px = X(re), py = Y(im);
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      if (tag) plot.text(tag, px + 9, py - 8, { color: color, font: '11px ui-monospace, monospace' });
    };

    for (let i = 0; i < poles.length; i++) drawX(poles[i].re, poles[i].im, PALETTE.accent2, 'p' + (i + 1));
    for (let i = 0; i < zeros.length; i++) drawO(zeros[i].re, zeros[i].im, PALETTE.accent3, 'z' + (i + 1));

    // ------------------------------------------------------------- header text
    plot.text(out.hLabel || '', pad + 8, pad + 14, { color: PALETTE.text, font: 'bold 13px ui-monospace, monospace' });
    plot.text(out.subLine || '', pad + 8, pad + 32, { color: PALETTE.accent, font: '12px ui-monospace, monospace' });
    plot.text('characteristic polynomial denominator order = ' + (out.den ? out.den.length - 1 : 0) +
      '   |   poles = ' + poles.length + '   |   zeros = ' + zeros.length +
      '   |   sum of poles = ' + fmt(poles.reduce((a, p) => a + p.re, 0), 5),
      pad + 8, pad + 50, { color: PALETTE.dim, font: '11px ui-monospace, monospace' });
    plot.text('legend:   x = pole,   o = zero,   blue band = ROC (causal),   dashed vertical = jw axis',
      pad + 8, pad + 67, { color: PALETTE.dim, font: '11px ui-monospace, monospace' });

    // -------------------------------------------------------------- verdict bar
    ctx.save();
    ctx.fillStyle = 'rgba(39,39,58,0.90)';
    ctx.fillRect(pad + 4, plot.h - pad - 30, plot.iw, 30);
    ctx.restore();
    plot.text(out.verdict || '', pad + 14, plot.h - pad - 10,
      { color: out.stable_ok ? PALETTE.accent3 : PALETTE.accent2, font: 'bold 12px ui-monospace, monospace' });
  },

  readout: (out) => ({
    'H(s)': out.hLabel || '—',
    'poles': locStr(out.poles, 'p'),
    'zeros': locStr(out.zeros, 'z'),
    'stability': out.stable || '—',
    'ROC (causal)': Number.isFinite(out.rocStart) ? 'Re(s) > ' + fmt(out.rocStart, 5) : 'entire s-plane',
    'jw axis inside ROC?': out.stable_ok ? 'YES — the DTFT/steady state exists' : 'NO — the jw axis is outside the ROC',
    'damping / natural freq': out.dampStr || '—',
    'zeta': Number.isFinite(out.zetaOut) && Math.abs(out.zetaOut) > 1e-12 ? fmt(out.zetaOut, 5) : 'n/a (no complex pair)',
    'wn': Number.isFinite(out.wnOut) && out.wnOut > 0 ? fmt(out.wnOut, 5) + ' rad/s' : 'n/a',
    'inverse Laplace form': out.form || '—',
    'dominant time constant 1/|sigma|': Number.isFinite(out.tau) ? fmt(out.tau, 5) + ' s' : 'infinite (not decaying)',
    'number of poles': String(out.count ?? 0),
  }),
});

// ---------------------------------------------------------------- closing note
const note = document.createElement('div');
note.className = 'vault-widget-note';
note.innerHTML =
  '<strong>The one sentence that answers most exam questions:</strong> the poles are the roots of the ' +
  '<em>denominator</em>, and they alone decide stability, while the zeros shape the amplitudes. ' +
  '<br><br><strong>The ROC, not the algebra, decides the time-domain form.</strong> The same H(s) = 1/(s &minus; a) ' +
  'is a decaying a^n / e^(a t) when causal (ROC |s| &gt; a) and a growing one when anti-causal. ' +
  'For a causal signal the ROC is always the half-plane right of the right-most pole, so "stable" and ' +
  '"all poles strictly left of the jw axis" are the same statement &mdash; and they are <em>not</em> the same ' +
  'as "no poles on the jw axis", which is the marginally-stable case. ' +
  '<br><br><strong>Exam mistake prevented:</strong> calling 1/(s(s+1)(s+2)) stable-looking because its poles ' +
  '(&minus;2, &minus;1, 0) are all non-positive. The pole at s = 0 sits <em>on</em> the jw axis, so the step ' +
  'response never settles &mdash; it is marginally stable, and the correct inverse transform carries a constant ' +
  '(step) term, not a decaying exponential. Working the quadratic formula on s^2 + 2&zeta;&omega;n s + &omega;n^2 ' +
  'by hand and finding &zeta; = &minus;Re(p)/|p| is the fastest way to catch this before it costs a mark.';
document.getElementById('app').appendChild(note);
</script>
</body>
</html>
