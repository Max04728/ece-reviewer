<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series RLC Step Response — α, ω₀ and the Characteristic Roots</title>
<link rel="stylesheet" href="../../../Assets/snippets.css">
</head>
<body>
<div id="app"></div>
<script type="module">
import { widget, fmt, PALETTE } from '../../../Assets/vault.js';

// A series RLC step response is the mass-spring-damper wearing different letters, but the
// numbers that decide the regime are NOT the same shape: here the criterion is
// R vs 2*sqrt(L/C) and alpha = R/(2L). Both classic slips (alpha = R/L, R_crit = sqrt(L/C))
// are one slider move away from being visible, and the readout always shows the
// characteristic roots so the classification can be checked by hand.

/** Human-readable roots of s^2 + 2*alpha*s + omega0^2 = 0. */
function rootLine(kind, alpha, wd, r1, r2) {
  if (kind === 'over') return 's₁ = ' + fmt(r1, 5) + ' ,  s₂ = ' + fmt(r2, 5) + '   (both real)';
  if (kind === 'critical') return 's = ' + fmt(-alpha, 5) + '   (repeated)';
  if (kind === 'lossless') return 's = ± j' + fmt(wd, 5) + '   (purely imaginary)';
  return 's = ' + fmt(-alpha, 5) + ' ± j' + fmt(wd, 5);
}

/** v_C(t) for a series RLC with a unit step at t = 0, v_C(0) = 0, i(0) = 0. */
function vcOf(kind, alpha, wd, r1, r2) {
  if (kind === 'over') {
    const d = r1 - r2;
    return (t) => 1 - (r1 * Math.exp(r2 * t) - r2 * Math.exp(r1 * t)) / d;
  }
  if (kind === 'critical') return (t) => 1 - (1 + alpha * t) * Math.exp(-alpha * t);
  if (kind === 'lossless') return (t) => 1 - Math.cos(wd * t);
  return (t) => 1 - Math.exp(-alpha * t) * (Math.cos(wd * t) + (alpha / wd) * Math.sin(wd * t));
}

widget({
  title: 'Series RLC Step Response — Over / Critical / Underdamped',
  description:
    'With v_C(0) = 0 and i(0) = 0, a unit step drives the capacitor voltage from 0 to 1. Everything about the shape is decided by α = R/(2L) versus ω₀ = 1/√(LC); the right-hand panel shows the characteristic roots moving in the s-plane as you slide R.',
  height: 480,
  range: { xMin: 0, xMax: 8, yMin: -0.35, yMax: 2.05 },
  controls: [
    { id: 'R', label: 'resistance R (Ω)', min: 0.2, max: 30, step: 0.1, value: 1 },
    { id: 'L', label: 'inductance L (H)', min: 0.1, max: 4, step: 0.05, value: 1 },
    { id: 'C', label: 'capacitance C (F)', min: 0.05, max: 4, step: 0.05, value: 1 },
    { id: 'T', label: 'time window (s)', min: 1, max: 30, step: 0.5, value: 12 },
    { id: 'poles', label: 'show s-plane poles', type: 'checkbox', value: true },
  ],
  compute: (v) => {
    const { R, L, C, T } = v;
    const alpha = R / (2 * L);
    const w0 = 1 / Math.sqrt(L * C);
    const zeta = alpha / w0;
    const Rcrit = 2 * Math.sqrt(L / C);

    // roots of s^2 + 2*alpha*s + w0^2 = 0
    const disc = alpha * alpha - w0 * w0;
    // Math.max(...) must be the LEFT operand: a numeric literal on the left of `*` makes
    // the parser treat this as classic-script multiplication, so `5e-4 * Math.max(a, b)`
    // becomes the STRING "1e-9" and every comparison against it is wrong.
    const tol = Math.max(alpha * alpha, w0 * w0) * 5e-4;
    let kind, wd = NaN, r1 = NaN, r2 = NaN;
    if (alpha === 0) {
      // R = 0 exactly: the lossless case, roots ±jω₀, v_C = 1 − cos ω₀t
      kind = 'lossless';
      wd = w0;
    } else if (Math.abs(disc) <= tol) {
      kind = 'critical';
      wd = 0;
    } else if (disc < 0) {
      wd = Math.sqrt(-disc);
      kind = 'under';
    } else {
      const sq = Math.sqrt(disc);
      r1 = -alpha + sq;
      r2 = -alpha - sq;
      kind = 'over';
    }
    const vc = vcOf(kind, alpha, wd, r1, r2);

    // exact peak overshoot time for the underdamped case: t_p = pi / wd
    const Mp = kind === 'under' || kind === 'lossless'
      ? Math.exp((-Math.PI * alpha) / (wd || 1))
      : 0;
    const tp = (kind === 'under' || kind === 'lossless') && wd > 0 ? Math.PI / wd : NaN;
    const tau = alpha > 0 ? 1 / alpha : Infinity;
    const fd = wd / (2 * Math.PI);

    // numbers the student can reproduce: sample the curve, and check the closed forms
    const at = (t) => vc(t);
    const vT = at(T);
    const RcritPct = (R / Rcrit - 1) * 100;

    return { R, L, C, T, alpha, w0, zeta, Rcrit, disc, kind, wd, r1, r2, vc, Mp, tp, tau, fd,
             vT, RcritPct, rootStr: rootLine(kind, alpha, wd, r1, r2) };
  },

  draw: (ctx, v, out, plot) => {
    const { T, vc } = out;

    // ------------------------------------------------ layout: left curve, right s-plane
    const pad = plot.pad;
    const split = pad + 560;
    const AX = { x0: pad + 8, x1: split, y0: pad + 64, y1: plot.h - pad - 50 };
    const BX = { x0: split + 46, x1: plot.w - pad - 8, y0: pad + 64, y1: plot.h - pad - 50 };

    plot.clear();

    // =============================================================== left: v_C(t)
    const XA = (t) => AX.x0 + (t / T) * (AX.x1 - AX.x0);
    const YA = (y) => AX.y1 - (y / 2) * (AX.y1 - AX.y0);
    ctx.save();
    ctx.strokeStyle = PALETTE.axis;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(AX.x0, AX.y0); ctx.lineTo(AX.x0, AX.y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(AX.x0, AX.y1); ctx.lineTo(AX.x1, AX.y1); ctx.stroke();
    ctx.strokeStyle = PALETTE.grid;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 4]);
    for (let k = 1; k <= 7; k++) {
      const y = k / 7 * 2;
      ctx.beginPath(); ctx.moveTo(AX.x0, YA(y)); ctx.lineTo(AX.x1, YA(y)); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.restore();

    // y labels
    for (const y of [0, 0.5, 1, 1.5, 2]) {
      plot.text(fmt(y, 3), AX.x0 - 6, YA(y) + 4, { color: PALETTE.dim, font: '10px ui-monospace, monospace', align: 'right' });
    }
    // time ticks
    const step = T <= 6 ? 1 : T <= 14 ? 2 : 5;
    for (let t = 0; t <= T + 1e-9; t += step) {
      ctx.save();
      ctx.strokeStyle = PALETTE.axis; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(XA(t), AX.y1); ctx.lineTo(XA(t), AX.y1 + 5); ctx.stroke();
      ctx.restore();
      plot.text(fmt(t, 3), XA(t), AX.y1 + 17, { color: PALETTE.dim, font: '10px ui-monospace, monospace', align: 'center' });
    }
    plot.text('time t (s)', (AX.x0 + AX.x1) / 2, AX.y1 + 34, { color: PALETTE.dim, font: '11px ui-monospace, monospace', align: 'center' });
    plot.text('capacitor voltage v_C(t), unit step', AX.x0, AX.y0 - 8, { color: PALETTE.text, font: 'bold 12px ui-monospace, monospace' });

    // final value and the ±2% settling band around it
    plot.segment(XA(0), 1, XA(T), 1, { color: PALETTE.accent3, width: 1.2, dash: [5, 4] });
    plot.segment(XA(0), 1.02, XA(T), 1.02, { color: 'rgba(166,227,161,0.30)', width: 1, dash: [2, 3] });
    plot.segment(XA(0), 0.98, XA(T), 0.98, { color: 'rgba(166,227,161,0.30)', width: 1, dash: [2, 3] });
    plot.text('final value 1 V', XA(T), 1.06, { color: PALETTE.accent3, font: '11px ui-monospace, monospace', align: 'right' });

    // the decaying envelope 1 ± e^{-alpha t} for the oscillatory cases
    if ((out.kind === 'under' || out.kind === 'lossless') && out.alpha > 0) {
      for (const sgn of [1, -1]) {
        ctx.save();
        ctx.strokeStyle = 'rgba(203,166,247,0.55)';
        ctx.lineWidth = 1.3;
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        for (let i = 0; i <= 400; i++) {
          const t = (i / 400) * T;
          const y = 1 + sgn * Math.exp(-out.alpha * t);
          i === 0 ? ctx.moveTo(XA(t), YA(y)) : ctx.lineTo(XA(t), YA(y));
        }
        ctx.stroke();
        ctx.restore();
      }
      plot.label('envelope 1 ± e^(−αt)', T * 0.55, 1 + Math.exp(-out.alpha * T * 0.55) * 0.97,
        { color: PALETTE.accent5, font: '11px ui-monospace, monospace' });
    }

    // the response
    ctx.save();
    ctx.strokeStyle = out.kind === 'over' ? PALETTE.accent4
                   : out.kind === 'critical' ? PALETTE.warn
                   : out.kind === 'lossless' ? PALETTE.accent5 : PALETTE.accent;
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= 1200; i++) {
      const t = (i / 1200) * T;
      const y = vc(t);
      if (!Number.isFinite(y)) { started = false; continue; }
      const px = XA(t), py = YA(y);
      if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.restore();

    // peak overshoot marker
    if (isFinite(out.tp) && out.tp <= T) {
      plot.dot(out.tp, 1 + out.Mp, { color: PALETTE.accent2, r: 4 });
      plot.text('peak = ' + fmt(1 + out.Mp, 4) + ' V at t = ' + fmt(out.tp, 4) + ' s  (overshoot ' +
        fmt(out.Mp * 100, 3) + '%)', out.tp, 1 + out.Mp + 0.10,
        { color: PALETTE.accent2, font: '11px ui-monospace, monospace' });
    }
    if (isFinite(out.tau) && out.tau <= T) {
      plot.segment(out.tau, 1, out.tau, 1.02, { color: PALETTE.accent3, width: 1.4, dash: [3, 3] });
      plot.text('τ = 1/α = ' + fmt(out.tau, 4) + ' s', out.tau, 1.0,
        { color: PALETTE.accent3, font: '10px ui-monospace, monospace' });
    }
    plot.dot(0, 0, { color: PALETTE.warn, r: 4 });

    // ------------------------------------------------ formula + substituted values
    plot.text('L q″ + R q′ + q/C = v_s   →   q″ + 2α q′ + ω₀² q = v_s/L',
      pad + 8, pad + 16, { color: PALETTE.text, font: '12px ui-monospace, monospace' });
    plot.text('α = R/(2L) = ' + fmt(out.R, 4) + '/(2×' + fmt(out.L, 4) + ') = ' + fmt(out.alpha, 5) +
      ' Np/s      ω₀ = 1/√(LC) = 1/√(' + fmt(out.L, 4) + '×' + fmt(out.C, 4) + ') = ' + fmt(out.w0, 5) + ' rad/s',
      pad + 8, pad + 34, { color: PALETTE.accent, font: '12px ui-monospace, monospace' });
    plot.text('R_crit = 2√(L/C) = ' + fmt(out.Rcrit, 5) + ' Ω      ζ = (R/2)√(C/L) = ' + fmt(out.zeta, 5) +
      '      R/R_crit = ' + fmt(out.R / out.Rcrit, 5),
      pad + 8, pad + 52 - 0, { color: PALETTE.dim, font: '12px ui-monospace, monospace' });

    // verdict strip under the two panels
    ctx.save();
    ctx.fillStyle = 'rgba(39,39,58,0.85)';
    ctx.fillRect(pad + 6, plot.h - pad - 30, plot.iw, 30);
    ctx.restore();
    const verdict = out.kind === 'over'
      ? 'OVERDAMPED — α > ω₀, two distinct real roots, no oscillation. R > 2√(L/C).'
      : out.kind === 'critical'
      ? 'CRITICALLY DAMPED — α = ω₀, one repeated root: v_C = 1 − (1 + αt)e^(−αt). Fastest settle with no overshoot.'
      : out.kind === 'lossless'
      ? 'UNDAMPED (R = 0) — α = 0, roots ±jω₀, v_C = 1 − cos ω₀t rings at ω₀ forever.'
      : 'UNDERDAMPED — α < ω₀, complex roots, v_C overshoots and rings at ω_d = √(ω₀² − α²).';
    plot.text(verdict, pad + 14, plot.h - pad - 10,
      { color: out.kind === 'over' ? PALETTE.accent4
             : out.kind === 'critical' ? PALETTE.warn
             : out.kind === 'lossless' ? PALETTE.accent5 : PALETTE.accent,
        font: 'bold 12px ui-monospace, monospace' });

    // =============================================================== right: s-plane
    if (!v.poles) return;
    ctx.save();
    ctx.fillStyle = 'rgba(39,39,58,0.65)';
    ctx.fillRect(BX.x0 - 40, BX.y0 - 26, BX.x1 - BX.x0 + 48, BX.y1 - BX.y0 + 44);
    ctx.restore();
    plot.text('s-plane: roots of s² + 2αs + ω₀²', BX.x0 - 36, BX.y0 - 10,
      { color: PALETTE.text, font: 'bold 11px ui-monospace, monospace' });

    const reMax = Math.max(1.25 * out.w0, 1e-6);
    const imMax = Math.max(1.25 * out.w0, 1e-6);
    const XB = (re) => BX.x0 + ((re + reMax) / (2 * reMax)) * (BX.x1 - BX.x0);
    const YB = (im) => BX.y1 - ((im + imMax) / (2 * imMax)) * (BX.y1 - BX.y0);

    // axes
    ctx.save();
    ctx.strokeStyle = PALETTE.axis; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(BX.x0, YB(0)); ctx.lineTo(BX.x1, YB(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(XB(0), BX.y0); ctx.lineTo(XB(0), BX.y1); ctx.stroke();
    // the unit-damping locus: points with |s| = w0 (the circle through the complex poles)
    ctx.strokeStyle = 'rgba(160,160,190,0.35)';
    ctx.setLineDash([3, 4]);
    ctx.beginPath();
    const rw = XB(out.w0) - XB(0);
    const rh = YB(0) - YB(out.w0);
    ctx.ellipse(XB(0), YB(0), Math.abs(rw), Math.abs(rh), 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    plot.text('σ (Np/s)', BX.x1, YB(0) - 6, { color: PALETTE.dim, font: '10px ui-monospace, monospace', align: 'right' });
    plot.text('jω', XB(0) + 5, BX.y0 + 2, { color: PALETTE.dim, font: '10px ui-monospace, monospace' });
    plot.text('|s| = ω₀', XB(out.w0) + 2, BX.y0 + 16, { color: PALETTE.dim, font: '10px ui-monospace, monospace' });
    plot.text('−α', XB(-out.alpha), YB(0) + 14, { color: PALETTE.accent2, font: '10px ui-monospace, monospace', align: 'center' });

    // the poles
    const poleColor = PALETTE.accent2;
    const mkPole = (re, im) => {
      ctx.save();
      ctx.strokeStyle = poleColor; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(XB(re) - 6, YB(im) - 6); ctx.lineTo(XB(re) + 6, YB(im) + 6);
      ctx.moveTo(XB(re) + 6, YB(im) - 6); ctx.lineTo(XB(re) - 6, YB(im) + 6);
      ctx.stroke();
      ctx.restore();
    };
    if (out.kind === 'over') { mkPole(out.r1, 0); mkPole(out.r2, 0); }
    else if (out.kind === 'critical') { mkPole(-out.alpha, 0); }
    else { mkPole(-out.alpha, out.wd); mkPole(-out.alpha, -out.wd); }

    // damped-frequency construction: the complex pole's coordinates
    if (out.kind === 'under') {
      ctx.save();
      ctx.strokeStyle = 'rgba(166,227,161,0.7)'; ctx.lineWidth = 1.2; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(XB(-out.alpha), YB(0)); ctx.lineTo(XB(-out.alpha), YB(out.wd)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(XB(-out.alpha), YB(out.wd)); ctx.lineTo(XB(0), YB(out.wd)); ctx.stroke();
      ctx.restore();
      plot.text('ωd', XB(-out.alpha) - 4, YB(out.wd / 2), { color: PALETTE.accent3, font: '10px ui-monospace, monospace', align: 'right' });
      plot.text('α', XB(-out.alpha / 2), YB(0) - 5, { color: PALETTE.accent3, font: '10px ui-monospace, monospace', align: 'center' });
    }
    plot.text(out.kind === 'over' ? 'poles on the real axis'
        : out.kind === 'lossless' ? 'poles exactly on jω axis'
        : 'pole pair off the axis',
      BX.x0 - 36, BX.y1 + 26, { color: PALETTE.dim, font: '10px ui-monospace, monospace' });
  },

  readout: (out) => ({
    'regime': out.kind === 'over' ? 'overdamped (α > ω₀)'
            : out.kind === 'critical' ? 'critically damped (α = ω₀)'
            : out.kind === 'lossless' ? 'undamped (R = 0)'
            : 'underdamped (α < ω₀)',
    'α = R/(2L)': fmt(out.alpha, 5) + ' Np/s',
    'ω₀ = 1/√(LC)': fmt(out.w0, 5) + ' rad/s',
    'ζ = (R/2)√(C/L)': fmt(out.zeta, 5),
    'R_crit = 2√(L/C)': fmt(out.Rcrit, 5) + ' Ω',
    'R / R_crit': fmt(out.R / out.Rcrit, 5) + '   (' + fmt(out.RcritPct, 4) + '% from critical)',
    'characteristic roots': out.rootStr,
    'ωd = √(ω₀² − α²)': isFinite(out.wd) && out.wd > 0 ? fmt(out.wd, 5) + ' rad/s' : 'none',
    'ring frequency fd': isFinite(out.fd) && out.fd > 0 ? fmt(out.fd, 5) + ' Hz' : '—',
    'overshoot': out.Mp > 0 ? fmt(out.Mp * 100, 4) + ' %' : '0 % (no overshoot)',
    'peak time tp = π/ωd': isFinite(out.tp) ? fmt(out.tp, 5) + ' s' : '—',
    'time constant τ = 1/α': isFinite(out.tau) ? fmt(out.tau, 5) + ' s' : '∞ (lossless)',
    'oscillatory?': (isFinite(out.wd) && out.wd > 0) ? 'YES — rings while it settles' : 'NO — monotonic rise',
    'v_C at window end': fmt(out.vT, 6) + ' V   (final value 1 V)',
  }),
});

// ---------------------------------------------------------------- closing note
const note = document.createElement('div');
note.className = 'vault-widget-note';
note.id = 'rlc-note';
document.getElementById('app').appendChild(note);

note.innerHTML =
  '<strong>Same mathematics, different letters.</strong> A series RLC is exactly the mass-spring-damper: ' +
  '<code>L ↔ m</code>, <code>R ↔ c</code>, <code>1/C ↔ k</code>, charge <code>q ↔ x</code>, and the step ' +
  'response of v_C is the step response of x. So α ↔ ζωn and ωd = √(ω₀² − α²) ↔ ωn√(1 − ζ²).<br>' +
  '<strong>But the damping criterion does not carry over in the same shape.</strong> For a series circuit ' +
  'critical damping is <code>R = 2√(L/C)</code> and <code>α = R/(2L)</code>; drop the factor 2 (writing ' +
  '<code>α = R/L</code>) or the factor 4 (writing <code>R_crit = √(L/C)</code>) and the regime is ' +
  'misclassified. Worse, a <em>parallel</em> RLC is the dual and its criteria are reciprocal — ' +
  '<code>α = 1/(2RC)</code> and <code>R_crit = ½√(L/C)</code>. Finally, note what ζ depends on: ' +
  'neither R nor C alone sets it, only the combination <code>(R/2)√(C/L)</code> — which is why a problem ' +
  'can change C and still leave ζ untouched when R and L move together. Convert mH and µF to H and F ' +
  'before substituting; leaving L in mH inflates ω₀ by √1000 and turns a sluggish circuit into a ringing one.';
</script>
</body>
</html>
